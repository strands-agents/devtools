[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "strandly-mcp"
version = "0.1.0"
description = "Thin MCP client for a deployed Strands Factory agent: Cognito login + a stdio MCP proxy. No agent stack, no AWS credentials."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "AWS", email = "opensource@amazon.com" }]
keywords = ["strands", "mcp", "agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
# The whole point of this distribution: `mcp` and the stdlib, nothing else. strands, strands-harness and
# strandly must never appear here — CI installs the wheel into a clean venv and asserts it.
dependencies = ["mcp<3"]

[project.urls]
Homepage = "https://github.com/strands-agents/devtools/tree/main/strands-factory"
Documentation = "https://github.com/strands-agents/devtools/tree/main/strands-factory/docs"
Repository = "https://github.com/strands-agents/devtools"
Issues = "https://github.com/strands-agents/devtools/issues"

[project.optional-dependencies]
# `strandly-mcp serve --agentcore` speaks InvokeAgentRuntime directly (SigV4) — admin fallback.
aws = ["boto3"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
strandly-mcp = "strandly_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/strandly_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src/strandly_mcp", "tests", "README.md", "pyproject.toml", "hatch_build.py", "LICENSE", "NOTICE", "scripts/verify_package.py"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "hatch_build.py" },
    { file = "LICENSE" },
    { file = "../../LICENSE" },
    { file = "NOTICE" },
    { file = "../../NOTICE" },
    { file = "../../harness/src/strandly/core/session_ids.py" },
]
