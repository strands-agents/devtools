<svg xmlns="http://www.w3.org/2000/svg" class="agent-runtime" viewBox="0 0 720 464" width="720" height="464" role="img" aria-labelledby="agent-runtime-title agent-runtime-desc">
  <title id="agent-runtime-title">Inside a Strands Factory agent run</title>
  <desc id="agent-runtime-desc">The agent runtime runs the Strands harness agent loop with its plugins (environment, skills, goal check). The loop calls the model on Amazon Bedrock, delegates to subagents that share the same sandbox, and calls two kinds of tools. File and shell tools (shell, read, write, edit) send commands to the sandbox runtime, an EC2 instance with a persistent workspace volume, which clones and pushes with git. Host tools (use_github, use_slack, schedule, MCP tools) run in the agent runtime and write to GitHub as the bot. The run saves its session snapshot to S3 and its transcript to AgentCore Memory.</desc>
  <!-- Type: architecture with boundary (left to right). Story: the agent decides and holds the credentials; every command it decides to run crosses into the sandbox, which holds none of them. -->
  <!-- Standalone styles scoped to this diagram's class: light by default, dark under prefers-color-scheme. Plain selectors (not :where) so non-browser renderers such as librsvg and resvg apply them too. -->
  <style>
    .agent-runtime { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
    .agent-runtime .dg-bg { fill: #ffffff; }
    .agent-runtime .dg-zone { fill: #f7f7f7; stroke: rgba(0, 0, 0, 0.16); stroke-width: 1; }
    .agent-runtime .dg-zone.is-boundary { fill: none; stroke: #666464; stroke-dasharray: 4 4; }
    .agent-runtime .dg-node { fill: #ffffff; stroke: #3d3c3c; stroke-width: 1; }
    .agent-runtime .dg-node.is-focal { fill: #e8f3ee; stroke: #007a3d; }
    .agent-runtime .dg-node.is-input { fill: #f2f2f2; stroke: #666464; }
    .agent-runtime .dg-node.is-optional { stroke-dasharray: 4 3; }
    .agent-runtime .dg-mask { fill: #ffffff; }
    .agent-runtime .dg-mask.is-on-zone { fill: #f7f7f7; }
    .agent-runtime .dg-edge { fill: none; stroke: #666464; stroke-width: 1.25; }
    .agent-runtime .dg-edge.is-accent { stroke: #007a3d; stroke-width: 1.5; }
    .agent-runtime .dg-edge.is-dashed { stroke-width: 1; stroke-dasharray: 4 3; }
    .agent-runtime .dg-lifeline { fill: none; stroke: rgba(0, 0, 0, 0.28); stroke-width: 1; stroke-dasharray: 3 3; }
    .agent-runtime .dg-head { fill: #666464; }
    .agent-runtime .dg-head.is-accent { fill: #007a3d; }
    .agent-runtime .dg-name { fill: #000000; font-size: 14px; font-weight: 600; }
    .agent-runtime .dg-sub { fill: #666464; font-size: 12px; }
    .agent-runtime .dg-code { fill: #666464; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; }
    .agent-runtime .dg-msg { fill: #3d3c3c; font-size: 12px; }
    .agent-runtime .dg-msg.is-accent { fill: #007a3d; font-weight: 500; }
    .agent-runtime .dg-label { fill: #666464; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; letter-spacing: 0.06em; }
    .agent-runtime .dg-label.is-accent { fill: #007a3d; }
    .agent-runtime .dg-eyebrow { fill: #666464; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; font-weight: 500; letter-spacing: 0.12em; }
    .agent-runtime .dg-note { fill: #666464; font-size: 12px; font-style: italic; }
    .agent-runtime .is-focal-text { fill: #007a3d; }
    @media (prefers-color-scheme: dark) {
    .agent-runtime .dg-bg { fill: #000000; }
    .agent-runtime .dg-zone { fill: #080808; stroke: rgba(255, 255, 255, 0.16); stroke-width: 1; }
    .agent-runtime .dg-zone.is-boundary { fill: none; stroke: #999696; stroke-dasharray: 4 4; }
    .agent-runtime .dg-node { fill: #000000; stroke: #b6b6b6; stroke-width: 1; }
    .agent-runtime .dg-node.is-focal { fill: #00120a; stroke: #00cc60; }
    .agent-runtime .dg-node.is-input { fill: #0d0d0d; stroke: #999696; }
    .agent-runtime .dg-node.is-optional { stroke-dasharray: 4 3; }
    .agent-runtime .dg-mask { fill: #000000; }
    .agent-runtime .dg-mask.is-on-zone { fill: #080808; }
    .agent-runtime .dg-edge { fill: none; stroke: #999696; stroke-width: 1.25; }
    .agent-runtime .dg-edge.is-accent { stroke: #00cc60; stroke-width: 1.5; }
    .agent-runtime .dg-edge.is-dashed { stroke-width: 1; stroke-dasharray: 4 3; }
    .agent-runtime .dg-lifeline { fill: none; stroke: rgba(255, 255, 255, 0.28); stroke-width: 1; stroke-dasharray: 3 3; }
    .agent-runtime .dg-head { fill: #999696; }
    .agent-runtime .dg-head.is-accent { fill: #00cc60; }
    .agent-runtime .dg-name { fill: #ffffff; font-size: 14px; font-weight: 600; }
    .agent-runtime .dg-sub { fill: #999696; font-size: 12px; }
    .agent-runtime .dg-code { fill: #999696; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; }
    .agent-runtime .dg-msg { fill: #b6b6b6; font-size: 12px; }
    .agent-runtime .dg-msg.is-accent { fill: #00cc60; font-weight: 500; }
    .agent-runtime .dg-label { fill: #999696; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; letter-spacing: 0.06em; }
    .agent-runtime .dg-label.is-accent { fill: #00cc60; }
    .agent-runtime .dg-eyebrow { fill: #999696; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; font-weight: 500; letter-spacing: 0.12em; }
    .agent-runtime .dg-note { fill: #999696; font-size: 12px; font-style: italic; }
    .agent-runtime .is-focal-text { fill: #00cc60; }
    }
  </style>
