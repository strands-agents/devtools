<svg xmlns="http://www.w3.org/2000/svg" class="system-overview" viewBox="0 0 720 468" width="720" height="468" role="img" aria-labelledby="system-overview-title system-overview-desc">
  <title id="system-overview-title">Strands Factory system overview</title>
  <desc id="system-overview-desc">People reach the agent from the portal, CLI, ACP, MCP, Slack DMs, and GitHub mentions, and schedules start runs on their own. Every request passes an ingress that authorizes the caller and invokes one agent runtime on an AgentCore microVM in your AWS account. The agent keeps sessions, the run ledger, and memory in S3, DynamoDB, and AgentCore Memory, sends every command to a separate sandbox runtime on its own EC2 instance, and writes to GitHub: the agent posts comments and pull requests, the sandbox clones and pushes with git.</desc>
  <!-- Type: architecture with boundary (top to bottom). Story: every surface goes through an ingress to one agent runtime; the agent decides, the sandbox executes, and GitHub is where the work lands. -->
  <!-- Standalone styles scoped to this diagram's class: light by default, dark under prefers-color-scheme. Plain selectors (not :where) so non-browser renderers such as librsvg and resvg apply them too. -->
