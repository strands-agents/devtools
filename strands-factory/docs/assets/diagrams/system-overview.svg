    .system-overview .dg-node { fill: #ffffff; stroke: #3d3c3c; stroke-width: 1; }
    .system-overview .dg-node.is-focal { fill: #e8f3ee; stroke: #007a3d; }
    .system-overview .dg-node.is-input { fill: #f2f2f2; stroke: #666464; }
    .system-overview .dg-node.is-optional { stroke-dasharray: 4 3; }
