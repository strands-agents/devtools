<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget=resizes-content: Android Chrome shrinks the layout viewport when the keyboard opens,
         so fixed/100dvh surfaces (chat composer, the sessions bottom sheet) rise with it instead of hiding under it. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#0c0c0e" />
    <meta name="color-scheme" content="dark light" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Strands" />
    <link rel="icon" type="image/png" href="./icons/frog.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <title>Strands Maintainer Portal</title>
    <style>
      /* Paint the page dark before the bundle loads — no white flash on launch. */
      html { background: #121215; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
